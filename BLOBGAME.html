<!DOCTYPE html>
<html>
<head>
    <title>Blob Test</title>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
        canvas { background: #87CEEB; border: 5px solid white; border-radius: 10px; cursor: crosshair; }
        #againBtn { display: none; margin-top: 20px; padding: 10px 30px; font-size: 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }

        #pauseBtn {
    margin-top: 20px;
    width: 60px;
    height: 60px;
    background-color: #e74c3c; /* Red */
    border: 3px solid white;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pause-icon {
    width: 16px;
    height: 22px;
    border-left: 6px solid white;
    border-right: 6px solid white;
    box-sizing: border-box;
}

#pauseBtn.play-mode {
    background-color: #2ecc71; /* Green */
    padding-left: 5px; 
}

#pauseBtn.play-mode .pause-icon {
    width: 0; height: 0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 20px solid white;
    border-right: none;
}
    </style>

<a href="index.html" style="background-color: blue; color: white; padding: 10px 20px; text-decoration: none; margin: 10px; display: inline-block;">Back to Game Hub</a>

</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button id="againBtn" onclick="location.reload()">Again?</button>

    <button id="pauseBtn">
    <div class="pause-icon"></div>
</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const againBtn = document.getElementById('againBtn');
const pauseBtn = document.getElementById('pauseBtn');

let score = 0;
let highScore = localStorage.getItem('blobHighScore') || 0;
let gameActive = true;
let isPaused = false;
let items = [];
let keys = {};

const player = { x: 80, y: 300, w: 70, h: 45, state: 'normal' };

// The "Checklist" that makes your keyboard work
window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

pauseBtn.onclick = () => {
    if (!gameActive) return;
    isPaused = !isPaused;
    if (isPaused) {
        pauseBtn.classList.add('play-mode');
    } else {
        pauseBtn.classList.remove('play-mode');
        requestAnimationFrame(draw); 
    }
};

function spawn() {
    if (!gameActive) return;
    if (!isPaused) {
        items.push({ x: 850, y: 315, type: Math.random() < 0.2 ? 'poison' : 'veggie', speed: 5 });
    }
    setTimeout(spawn, 1000 + Math.random() * 1000);
}

function drawPlayer(x, y) {
    ctx.save();
    // Turn green and shake if poisoned
    if (player.state === 'poisoned') {
        ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
        ctx.fillStyle = '#7db343'; 
    } else {
        ctx.fillStyle = 'white';
    }
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    
    // The White Blob Body
    ctx.beginPath();
    ctx.moveTo(x + 70, y + 45); 
    ctx.lineTo(x, y + 45);      
    ctx.bezierCurveTo(x, y - 5, x + 70, y - 5, x + 70, y + 45); 
    ctx.fill();
    ctx.stroke();

    // Eyes looking RIGHT
    ctx.fillStyle = 'black';
    ctx.fillRect(x + 45, y + 15, 3, 12);
    ctx.fillRect(x + 55, y + 15, 3, 12);
    ctx.restore();
}

function drawItem(it) {
    if (it.type === 'veggie') {
        // orange carrot
        ctx.fillStyle = '#e67e22'; ctx.fillRect(it.x, it.y, 12, 25);
        ctx.fillStyle = '#27ae60'; ctx.fillRect(it.x - 3, it.y - 6, 18, 8);
    } else {
        //brown potato
        ctx.fillStyle = '#5d4037'; ctx.beginPath();
        ctx.ellipse(it.x + 15, it.y + 15, 18, 12, 0, 0, Math.PI * 5); ctx.fill();
    }
}

function draw() {
    if (isPaused) return;

    // Background
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, 345, canvas.width, 55);

    drawPlayer(player.x, player.y);

    for (let i = items.length - 1; i >= 0; i--) {
        items[i].x -= items[i].speed;
        drawItem(items[i]); // VEGGIES APPEAR HERE

        if (items[i].x < player.x + 70 && items[i].x + 20 > player.x) {
            if (!keys['c'] && keys[' '] && items[i].type === 'veggie') {
                score++; 
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('blobHighScore', highScore);
                }
                player.state = 'eating'; 
                items.splice(i, 1);
                setTimeout(() => player.state = 'normal', 200);
            } else if (!keys['c'] && items[i].type === 'poison') {
                gameActive = false; 
                player.state = 'poisoned';
                againBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
            }
        }
    }

    // High Score and Score display
    ctx.fillStyle = "white";
    ctx.font = "bold 25px 'Roboto Mono', monospace";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 40);
    ctx.fillText("High Score: " + highScore, 20, 75);

    if (gameActive) {
        requestAnimationFrame(draw);
    } else {
        // Game Over Overlay
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "50px Arial";
        ctx.fillText("GAME OVER", 400, 180);
        ctx.font = "25px Arial";
        ctx.fillText("Final Score: " + score, 400, 230);
        ctx.fillText("High Score: " + highScore, 400, 265);
    }
}

spawn();
draw();
</script>

<h3> DIRECTIONS: hold down C to avoid poisonous potatoes (brown ovals), and hold down space to absorb carrots. Get the score as high as you can! good luck!</h3>
    
</body>
</html>
